name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check src tests examples scripts
      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - run: pytest -q --cov=branchproof --cov-report=term-missing
      - run: python examples/strengthen_demo.py --unsafe-local
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: docker build -t hardener-sandbox:py312 -t hardener-sandbox:tests-v1 docker
      - run: HARDENER_DOCKER_TESTS=1 pytest -q tests/test_sandbox.py
      - run: HARDENER_DOCKER_TESTS=1 pytest -q tests/test_strengthen.py
      - run: HARDENER_DOCKER_TESTS=1 pytest -q tests/test_test_study.py
      - run: python examples/strengthen_demo.py
