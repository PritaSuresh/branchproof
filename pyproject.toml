[project]
name = "branchproof"
version = "0.3.0"
license = "MIT"
readme = "README.md"
description = "Mutation-guided test generation with execution-verified acceptance and patch export"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.8",
    "pydantic>=2.7",
    "coverage>=7.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
branchproof = "branchproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
